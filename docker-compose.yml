services:
  frontend:
    build:
      context: ./frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    env_file:
      - ./frontend/.env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    command: python -m app.run_server
    env_file:
      - ./backend/.env
      - ./backend/.env.secrets
    environment:
      APP_ENV: local
      SERVICE_NAME: backend
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      BACKEND_RELOAD: "false"
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: ./worker
    command: celery -A app.celery_app.celery_app worker --loglevel=info
    env_file:
      - ./worker/.env
      - ./worker/.env.secrets
    environment:
      APP_ENV: local
      SERVICE_NAME: worker
      LOG_LEVEL: INFO
    volumes:
      - ./worker:/app
    depends_on:
      - postgres
      - redis

  beat:
    build:
      context: ./worker
    command: celery -A app.celery_app.celery_app beat --loglevel=info
    env_file:
      - ./worker/.env
      - ./worker/.env.secrets
    environment:
      APP_ENV: local
      SERVICE_NAME: beat
      LOG_LEVEL: INFO
    volumes:
      - ./worker:/app
    depends_on:
      - postgres
      - redis

  sync-dispatcher:
    build:
      context: ./worker
    command: python -m app.sync_dispatcher_runner
    env_file:
      - ./worker/.env
      - ./worker/.env.secrets
    environment:
      APP_ENV: local
      SERVICE_NAME: sync-dispatcher
      LOG_LEVEL: INFO
    volumes:
      - ./worker:/app
    depends_on:
      backend:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: strava_insights
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
