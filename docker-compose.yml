# Secrets are interpolated from the root .env.secrets file: docker compose --env-file .env.secrets ...
x-worker-environment: &worker-environment
  APP_ENV: local
  DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/strava_insights
  REDIS_URL: redis://redis:6379/0
  LOG_LEVEL: INFO
  SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:?set SESSION_SECRET_KEY in .env.secrets}
  DAILY_SYNC_CRON_HOUR_UTC: 3
  DAILY_SYNC_CRON_MINUTE_UTC: 0
  LLM_BASE_URL: https://generativelanguage.googleapis.com/v1beta/openai
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: gemini-3.8-flash
  LLM_REASONING_EFFORT: low
  COACHING_BATCH_SIZE: 5
  COACHING_POLL_INTERVAL_MINUTES: 15

services:
  frontend:
    build:
      context: ./frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_MAPYCZ_API_KEY: ${VITE_MAPYCZ_API_KEY:-}
      VITE_LOG_LEVEL: INFO
      VITE_ADMIN_ATHLETE_ID: 68c0e5b9-3370-4e83-904b-de6edcf24551
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    command: python -m app.run_server
    environment:
      APP_ENV: local
      SERVICE_NAME: backend
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      BACKEND_RELOAD: "false"
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/strava_insights
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:?set SESSION_SECRET_KEY in .env.secrets}
      SESSION_COOKIE_NAME: strava_insights_session
      SESSION_MAX_AGE_SECONDS: 1209600
      SESSION_HTTPS_ONLY: "false"
      BACKEND_PUBLIC_URL: http://localhost:8000
      FRONTEND_PUBLIC_URL: http://localhost:5173
      ADMIN_EXTERNAL_USER_ID: 68c0e5b9-3370-4e83-904b-de6edcf24551
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: ./worker
    command: celery -A app.celery_app.celery_app worker --loglevel=info
    environment:
      <<: *worker-environment
      SERVICE_NAME: worker
    volumes:
      - ./worker:/app
    depends_on:
      - postgres
      - redis

  beat:
    build:
      context: ./worker
    command: celery -A app.celery_app.celery_app beat --loglevel=info
    environment:
      <<: *worker-environment
      SERVICE_NAME: beat
    volumes:
      - ./worker:/app
    depends_on:
      - postgres
      - redis

  sync-dispatcher:
    build:
      context: ./worker
    command: python -m app.sync_dispatcher_runner
    environment:
      <<: *worker-environment
      SERVICE_NAME: sync-dispatcher
    volumes:
      - ./worker:/app
    depends_on:
      backend:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: strava_insights
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
