services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${FRONTEND_VITE_API_BASE_URL}
        VITE_MAPYCZ_API_KEY: ${FRONTEND_VITE_MAPYCZ_API_KEY}
        VITE_LOG_LEVEL: INFO
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    command: python -m app.run_server
    env_file:
      - ./backend/.env.secrets
    environment:
      APP_ENV: production
      SERVICE_NAME: backend
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      BACKEND_RELOAD: "false"
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@postgres:5432/strava_insights
      LOG_LEVEL: INFO
      REDIS_URL: redis://redis:6379/0
      SESSION_COOKIE_NAME: strava_insights_session
      SESSION_MAX_AGE_SECONDS: 1209600
      SESSION_HTTPS_ONLY: "true"
      BACKEND_PUBLIC_URL: https://${DOMAIN}
      FRONTEND_PUBLIC_URL: https://${DOMAIN}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile.prod
    command: celery -A app.celery_app.celery_app worker --loglevel=info
    env_file:
      - ./worker/.env.secrets
    environment:
      APP_ENV: production
      SERVICE_NAME: worker
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@postgres:5432/strava_insights
      LOG_LEVEL: INFO
      REDIS_URL: redis://redis:6379/0
      DAILY_SYNC_CRON_HOUR_UTC: 3
      DAILY_SYNC_CRON_MINUTE_UTC: 0
    restart: unless-stopped
    depends_on:
      - postgres
      - redis

  beat:
    build:
      context: ./worker
      dockerfile: Dockerfile.prod
    command: celery -A app.celery_app.celery_app beat --loglevel=info
    env_file:
      - ./worker/.env.secrets
    environment:
      APP_ENV: production
      SERVICE_NAME: beat
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@postgres:5432/strava_insights
      LOG_LEVEL: INFO
      REDIS_URL: redis://redis:6379/0
      DAILY_SYNC_CRON_HOUR_UTC: 3
      DAILY_SYNC_CRON_MINUTE_UTC: 0
    restart: unless-stopped
    depends_on:
      - postgres
      - redis

  sync-dispatcher:
    build:
      context: ./worker
      dockerfile: Dockerfile.prod
    command: python -m app.sync_dispatcher_runner
    env_file:
      - ./worker/.env.secrets
    environment:
      APP_ENV: production
      SERVICE_NAME: sync-dispatcher
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@postgres:5432/strava_insights
      LOG_LEVEL: INFO
      REDIS_URL: redis://redis:6379/0
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: strava_insights
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
